name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: make verify
        env:
          COCKPIT_CONSUMER_NAMES: ${{ vars.COCKPIT_CONSUMER_NAMES }}
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/build-npm.sh "${GITHUB_REF_NAME#v}" dist/npm
      - run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc" && cd dist/npm && bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
