version: 2
project_name: cockpit

before:
  hooks:
    - scripts/build-runners.sh {{ .Version }}

builds:
  - id: cockpit
    main: ./cmd/cockpit
    binary: cockpit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/d0lim/cockpit/internal/version.Version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

release:
  disable: false

homebrew_casks:
  - name: cockpit
    binaries:
      - cockpit
    repository:
      owner: d0lim
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_msg_template: "chore(cockpit): release {{ .Version }}"
    homepage: https://github.com/d0lim/cockpit
    description: Run hub that runs one commit of a compose stack end to end in a sealed environment
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/cockpit"]
          end
